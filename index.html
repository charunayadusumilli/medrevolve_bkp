      <main style="max-width:900px;margin:0 auto;padding:32px 16px;font-family:system-ui,sans-serif;line-height:1.6">
        <h1>Your brand. Your telehealth business. Live in about 7 days.</h1>
        <p>For clinic, med spa and pharmacy owners who want a new revenue line under their own name. MedRevolve plugs in the site, providers, pharmacy, payments and compliance.</p>
        <p><a href="https://calendly.com/rned-medrevolve/medrevolve-intro-call">Book a free 20-minute demo</a> · <a href="https://medrevolve.com/social/index.html">Graphics library</a> · <a href="https://medrevolve.com/social/feed.json">Graphics feed (JSON)</a></p>
        <h2>The 7-day launch</h2>
        <ol>
          <li>Day 1, brand and discovery: name, logo, colors, domain, programs and states.</li>
          <li>Day 2, storefront build: your site on your domain, from intake to checkout.</li>
          <li>Day 3, providers plugged in: visit types, intake and e-prescribing tested.</li>
          <li>Day 4, pharmacy plugged in: 503A fulfilment, shipping and tracking tested.</li>
          <li>Day 5, payments live: merchant account, refunds, refills and payouts.</li>
          <li>Day 6, compliance check: HIPAA, LegitScript readiness, claims and advertising review.</li>
          <li>Day 7, go live and announce: CRM on, posts out, named support contact.</li>
        </ol>
        <h2>Telehealth Plan: 14 items in every launch</h2>
        <ol>
          <li>Custom telehealth platform development</li><li>Essential plugins and third-party integrations</li><li>Admin dashboard and patient management</li><li>Doctor profiles and appointment booking</li><li>Secure video and audio consultations</li><li>Patient dashboard and medical history</li><li>Secure patient messaging</li><li>Payment gateway integration</li><li>Security-focused, compliance-ready setup</li><li>LegitScript readiness guidance</li><li>Dedicated project manager</li><li>Testing and quality assurance</li><li>Post-launch technical assistance</li><li>Ongoing growth and scalability support</li>
        </ol>
        <p>Setup and ongoing costs are quoted on a short call, based on your programs, states and services. Third-party costs we walk you through: medication and pharmacy fulfilment, provider visit fees, payment processing fees, LegitScript certification fees, labs, domain and ad spend.</p>
        <h2>Get the white-label launch checklist</h2>
        <p>Have ready before Day 1: business name, logo and colors; a domain; programs and target states; business details for underwriting; owner ID; business bank account; program pricing; who answers patient messages; your launch announcement list.</p>
        <p><small>MedRevolve is a technology and services platform for healthcare businesses. It does not provide medical care. Clinical services are provided by independent licensed providers, and prescriptions are issued only when a provider determines they are clinically appropriate. Compounded medications are not FDA-approved.</small></p>
      </main>
